<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .panel { fill: #f6f7f9; stroke: #c9cdd4; }
    .panelbad { fill: #fdf3f3; stroke: #d09090; }
    .panelgood { fill: #eef7f0; stroke: #6aa87a; }
    .title { font-size: 14px; font-weight: 700; fill: #1f2329; }
    .sub { font-size: 11px; fill: #5c6370; }
    .bad { font-size: 11.5px; fill: #a04545; }
    .good { font-size: 11.5px; fill: #2e7d4f; }
    .mock { fill: #ffffff; stroke: #c9cdd4; }
    .mockdark { fill: #1a1714; stroke: #444; }
    .mocktext { fill: #d9d4c8; font-size: 9px; }
    .grad { fill: url(#aigrad); }
  </style>
  <defs>
    <linearGradient id="aigrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b88af0"/>
      <stop offset="1" stop-color="#f08ac0"/>
    </linearGradient>
  </defs>

  <!-- LEFT: default agent -->
  <rect class="panelbad" x="20" y="20" width="455" height="440" rx="10"/>
  <text class="title" x="247" y="50" text-anchor="middle">默认 agent：「做了个网页」（模拟样本）</text>

  <!-- mock scrolling page -->
  <rect class="mock" x="80" y="70" width="330" height="300" rx="6"/>
  <rect class="grad" x="80" y="70" width="330" height="56" rx="6"/>
  <text class="sub" x="245" y="102" text-anchor="middle" fill="#fff" font-weight="700">✨ AI 工具大测评 ✨</text>
  <rect x="100" y="142" width="290" height="9" rx="4" fill="#d8dce2"/>
  <rect x="100" y="158" width="290" height="9" rx="4" fill="#d8dce2"/>
  <rect x="100" y="174" width="250" height="9" rx="4" fill="#d8dce2"/>
  <text class="sub" x="100" y="204">• 工具一：Claude Code …</text>
  <text class="sub" x="100" y="222">• 工具二：Cursor …</text>
  <text class="sub" x="100" y="240">• 工具三：Copilot …</text>
  <text class="sub" x="100" y="258">• 工具四：Windsurf …</text>
  <text class="sub" x="100" y="276">• 工具五：Codex …</text>
  <rect x="100" y="292" width="290" height="9" rx="4" fill="#d8dce2"/>
  <rect x="100" y="308" width="290" height="9" rx="4" fill="#d8dce2"/>
  <rect x="100" y="330" width="290" height="22" rx="11" fill="#e8e2f5"/>
  <text class="sub" x="245" y="345" text-anchor="middle">© 2026 AI 工具测评 · 关注我们 👍</text>

  <text class="bad" x="60" y="398">✗ 上下滚动布局——录屏窗口一动排版就变</text>
  <text class="bad" x="60" y="418">✗ 五个工具一屏全亮，口播讲到第二个观众已读完第五个</text>
  <text class="bad" x="60" y="438">✗ 紫粉渐变＋emoji＋页眉页脚——一眼 AI 制品</text>

  <!-- RIGHT: skill output -->
  <rect class="panelgood" x="505" y="20" width="455" height="440" rx="10"/>
  <text class="title" x="732" y="50" text-anchor="middle">本 skill：可录屏的 16:9 舞台（结构示意）</text>

  <!-- mock 16:9 stage -->
  <rect class="mockdark" x="565" y="70" width="336" height="189" rx="4"/>
  <text class="mocktext" x="585" y="100" font-size="11">CHAPTER 03 — SHOWDOWN</text>
  <text x="585" y="160" fill="#f5f0e5" font-size="30" font-weight="700">Cursor</text>
  <text x="585" y="186" fill="#ff4a2b" font-size="15">改写 7 篇 · 2 篇要返工</text>
  <text class="mocktext" x="585" y="216" opacity="0.45">Claude Code ✓ 已讲过（灰化保留）</text>
  <rect x="565" y="252" width="120" height="4" fill="#ff4a2b" opacity="0.85"/>
  <text class="mocktext" x="893" y="248" text-anchor="end" opacity="0.6">step 14 / 38</text>

  <text class="good" x="545" y="292">✓ 1920×1080 固定坐标系，整体缩放——录出来永远一样</text>
  <text class="good" x="545" y="312">✓ 一步一画面：点击推进口播节拍，讲谁亮谁</text>
  <text class="good" x="545" y="332">✓ 进度条平时隐形，画面无 chrome 可录</text>
  <text class="good" x="545" y="352">✓ 颜色字体走主题 token，换主题不改章节</text>

  <rect class="panel" x="545" y="375" width="375" height="66" rx="8"/>
  <text class="sub" x="560" y="397">同一份内容，38 个 step ＝ 38 个口播节拍 ＝ 38 个 mp3，</text>
  <text class="sub" x="560" y="415">?auto=1 按 Space 后整片自动播完——录屏即成片，</text>
  <text class="sub" x="560" y="433">不需要后期对音轨。</text>
</svg>
