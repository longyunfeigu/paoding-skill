<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <style>
    .input { fill: #f6f7f9; stroke: #c9cdd4; }
    .file { fill: #fdf3f7; stroke: #c2628f; }
    .ephemeral { fill: #fff7e6; stroke: #d99a2b; }
    .final { fill: #e9f7ef; stroke: #3d9a5f; }
    .lbl { font-size: 13px; fill: #1f2329; font-weight: 600; }
    .sub { font-size: 11px; fill: #5c6370; }
    .who { font-size: 10px; fill: #9097a3; }
    .edge { stroke: #8a8f98; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
    .elbl { font-size: 10px; fill: #6b7280; }
  </style>

  <!-- Column header legend -->
  <text class="who" x="30" y="24">■ 灰=输入　■ 粉=落盘文件　■ 黄=对话内临时产物　■ 绿=最终交付</text>

  <!-- user input -->
  <rect class="input" x="30" y="50" width="170" height="60" rx="8"/>
  <text class="lbl" x="115" y="75" text-anchor="middle">用户输入</text>
  <text class="sub" x="115" y="94" text-anchor="middle">「蒸馏孙宇晨」+ 可选本地语料</text>

  <!-- sources/ -->
  <rect class="file" x="30" y="170" width="170" height="76" rx="8"/>
  <text class="lbl" x="115" y="193" text-anchor="middle">sources/</text>
  <text class="sub" x="115" y="211" text-anchor="middle">books / transcripts / articles</text>
  <text class="who" x="115" y="229" text-anchor="middle">写:用户 + 字幕脚本链</text>

  <!-- research files -->
  <rect class="file" x="280" y="120" width="220" height="160" rx="8"/>
  <text class="lbl" x="390" y="145" text-anchor="middle">references/research/</text>
  <text class="sub" x="390" y="166" text-anchor="middle">01-writings · 02-conversations</text>
  <text class="sub" x="390" y="183" text-anchor="middle">03-expression-dna · 04-external</text>
  <text class="sub" x="390" y="200" text-anchor="middle">05-decisions · 06-timeline</text>
  <text class="who" x="390" y="224" text-anchor="middle">写:6 个调研 agent(各管一份)</text>
  <text class="who" x="390" y="241" text-anchor="middle">读:merge_research.py、Phase 2 提炼、</text>
  <text class="who" x="390" y="256" text-anchor="middle">成品附录(永久引用)</text>

  <!-- 1.5 summary -->
  <rect class="ephemeral" x="580" y="80" width="180" height="80" rx="8"/>
  <text class="lbl" x="670" y="103" text-anchor="middle">检查点 1.5 摘要表</text>
  <text class="sub" x="670" y="121" text-anchor="middle">来源数 / 关键发现 / 矛盾点</text>
  <text class="who" x="670" y="142" text-anchor="middle">写:merge_research.py　读:用户</text>

  <!-- phase2 synthesis -->
  <rect class="ephemeral" x="580" y="200" width="180" height="80" rx="8"/>
  <text class="lbl" x="670" y="223" text-anchor="middle">检查点 2.5 提炼摘要</text>
  <text class="sub" x="670" y="241" text-anchor="middle">模型 N 个 / 启发式 / 张力 / 边界</text>
  <text class="who" x="670" y="262" text-anchor="middle">写:主 agent　读:用户</text>

  <!-- SKILL.md -->
  <rect class="final" x="280" y="360" width="260" height="120" rx="8"/>
  <text class="lbl" x="410" y="385" text-anchor="middle">[person]-perspective/SKILL.md</text>
  <text class="sub" x="410" y="406" text-anchor="middle">心智模型 3-7 个 · 启发式 5-10 条</text>
  <text class="sub" x="410" y="423" text-anchor="middle">表达DNA · Agentic Protocol · 诚实边界</text>
  <text class="who" x="410" y="447" text-anchor="middle">写:Phase 3(按 skill-template.md)</text>
  <text class="who" x="410" y="464" text-anchor="middle">读:验证子agent、quality_check.py、最终用户</text>

  <!-- test reports -->
  <rect class="ephemeral" x="620" y="380" width="200" height="80" rx="8"/>
  <text class="lbl" x="720" y="403" text-anchor="middle">验证与精炼报告</text>
  <text class="sub" x="720" y="421" text-anchor="middle">已知/边缘/风格测试 + 6 项机器检查</text>
  <text class="who" x="720" y="442" text-anchor="middle">写:子agent ×3　读:主agent + 用户</text>

  <!-- edges -->
  <path class="edge" d="M115 110 V168"/>
  <text class="elbl" x="125" y="140">本地语料落盘</text>
  <path class="edge" d="M200 208 H278"/>
  <text class="elbl" x="208" y="200">6 agent 阅读</text>
  <path class="edge" d="M200 80 H240 V140 H278" />
  <text class="elbl" x="212" y="72">无语料→网络搜索</text>
  <path class="edge" d="M500 170 C 540 160, 550 130, 578 120"/>
  <text class="elbl" x="508" y="150">脚本扫描统计</text>
  <path class="edge" d="M500 230 C 540 235, 550 238, 578 240"/>
  <text class="elbl" x="508" y="255">三重验证筛选</text>
  <path class="edge" d="M670 280 V330 H460 V358"/>
  <text class="elbl" x="480" y="345">确认后组装</text>
  <path class="edge" d="M540 420 H618"/>
  <text class="elbl" x="552" y="412">独立验证</text>
  <path class="edge" d="M390 280 V358"/>
  <text class="elbl" x="300" y="320">附录永久引用 research/</text>
</svg>
